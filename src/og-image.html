<!DOCTYPE html>
<!-- Template for assets/images/og-image.png (1200×630) – serve the repo root, open /src/og-image.html at that viewport size and take a screenshot -->
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px; height: 630px; overflow: hidden;
            font-family: 'Inter', sans-serif; color: #e5e7eb;
            background: radial-gradient(circle at 82% 45%, rgba(14,165,233,0.22), transparent 42%), #020617;
            display: flex; align-items: center; justify-content: space-between; padding: 0 80px 0 88px;
            position: relative;
        }
        body::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #0ea5e9;
        }
        .text { max-width: 690px; }
        .role { color: #0ea5e9; font-weight: 600; font-size: 26px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
        h1 { font-size: 100px; font-weight: 800; color: #fff; letter-spacing: -0.03em; line-height: 1; margin-bottom: 36px; }
        .tags { display: flex; gap: 12px; margin-bottom: 44px; }
        .tag { border: 1px solid #1f2937; background: #0f172a; border-radius: 10px; padding: 10px 18px; font-size: 21px; color: #d1d5db; white-space: nowrap; }
        .tag i { color: #0ea5e9; margin-right: 10px; }
        .url { font-size: 24px; color: #9ca3af; }
        .photo { position: relative; flex-shrink: 0; margin-right: 18px; margin-bottom: 18px; }
        .photo::before {
            content: ''; position: absolute; inset: 0; transform: translate(18px, 18px);
            border: 2px solid rgba(14,165,233,0.6); border-radius: 28px;
        }
        .photo img { position: relative; display: block; width: 320px; height: 400px; object-fit: cover; border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="text">
        <div class="role">Software Architect &amp; .NET Developer</div>
        <h1>Martin Goffa</h1>
        <div class="tags">
            <div class="tag"><i class="fa-brands fa-microsoft"></i>.NET &amp; Blazor</div>
            <div class="tag"><i class="fa-solid fa-cloud"></i>Microsoft Azure</div>
            <div class="tag"><i class="fa-solid fa-robot"></i>AI integrace</div>
        </div>
        <div class="url">dev.goffa.cz</div>
    </div>
    <div class="photo">
        <img src="/assets/images/martin-goffa-portrait.jpg" alt="">
    </div>
</body>
</html>
