<!DOCTYPE html>
<!-- Template for assets/images/og-image.png (1200×630) – render at that viewport size and take a screenshot -->
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px; height: 630px; overflow: hidden;
            font-family: 'Inter', sans-serif; color: #e5e7eb;
            background: radial-gradient(circle at 85% 15%, rgba(14,165,233,0.25), transparent 45%), #020617;
            display: flex; flex-direction: column; justify-content: center; padding: 0 96px;
            position: relative;
        }
        body::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #0ea5e9;
        }
        .logo { font-weight: 800; font-size: 30px; letter-spacing: 0.05em; margin-bottom: 56px; }
        .logo span, .accent { color: #0ea5e9; }
        .role { color: #0ea5e9; font-weight: 600; font-size: 28px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
        h1 { font-size: 104px; font-weight: 800; color: #fff; letter-spacing: -0.03em; line-height: 1; margin-bottom: 40px; }
        .tags { display: flex; gap: 16px; }
        .tag { border: 1px solid #1f2937; background: #0f172a; border-radius: 10px; padding: 12px 22px; font-size: 26px; color: #d1d5db; }
        .tag i { color: #0ea5e9; margin-right: 10px; }
        .url { position: absolute; right: 96px; bottom: 48px; font-size: 26px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="logo"><span>&lt;</span> MartinGoffa <span>/&gt;</span></div>
    <div class="role">Software Architect &amp; Full-stack Developer</div>
    <h1>Martin Goffa</h1>
    <div class="tags">
        <div class="tag"><i class="fa-brands fa-microsoft"></i>.NET &amp; Blazor</div>
        <div class="tag"><i class="fa-solid fa-cloud"></i>MS Azure</div>
        <div class="tag"><i class="fa-solid fa-robot"></i>AI-assisted development</div>
    </div>
    <div class="url">dev.goffa.cz</div>
</body>
</html>
